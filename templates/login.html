
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | OfflineChainGuard</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, #49334F 0%, transparent 35%),
                radial-gradient(circle at 85% 80%, #49334F 0%, transparent 35%),
                #211A2B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 25px;
            overflow: hidden;
            position: relative;
        }

        /* Decorative background watermark */

        .background-mark {
            position: fixed;
            width: 470px;
            height: 470px;
            right: -100px;
            bottom: -130px;
            opacity: 0.07;
            pointer-events: none;
        }

        .background-mark svg {
            width: 100%;
            height: 100%;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 410px;
            background: #FFFAF8;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto 18px;
            background: #49334F;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(73, 51, 79, 0.2);
        }

        .logo svg {
            width: 48px;
            height: 48px;
        }

        h2 {
            text-align: center;
            color: #49334F;
            margin: 0;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #9B7C88;
            font-size: 14px;
            margin: 10px 0 28px;
        }

        .security-label {
            text-align: center;
            color: #A56D7C;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
            color: #49334F;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #E2D4DA;
            border-radius: 8px;
            background: #FFFFFF;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #C17F8C;
            box-shadow: 0 0 0 3px rgba(193, 127, 140, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 28px;
            background: #49334F;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #79516E;
        }

        .message {
            background: #F9E8E9;
            color: #963F52;
            text-align: center;
            padding: 11px;
            border-radius: 7px;
            font-size: 13px;
        }

        .register {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #806C77;
        }

        .register a {
            color: #A85D70;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            color: #B5A2AD;
            font-size: 11px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 23px;
            }

            .background-mark {
                width: 300px;
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Decorative background shield -->

    <div class="background-mark" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none"
             xmlns="http://www.w3.org/2000/svg">

            <path d="M100 12 L165 38 V91
                     C165 137 137 169 100 188
                     C63 169 35 137 35 91 V38 Z"
                  stroke="#E8B99B" stroke-width="5"/>

            <path d="M70 100 L91 121 L132 78"
                  stroke="#E8B99B" stroke-width="6"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>

            <circle cx="25" cy="25" r="7" fill="#C17F8C"/>
            <circle cx="175" cy="25" r="7" fill="#C17F8C"/>
            <circle cx="25" cy="175" r="7" fill="#C17F8C"/>
            <circle cx="175" cy="175" r="7" fill="#C17F8C"/>

            <path d="M25 25 L65 45 M175 25 L145 45
                     M25 175 L65 145 M175 175 L145 145"
                  stroke="#C17F8C" stroke-width="2"/>
        </svg>
    </div>

    <div class="container">

        <div class="logo">
            <!-- Shield and lock symbol -->
            <svg viewBox="0 0 64 64" fill="none"
                 xmlns="http://www.w3.org/2000/svg">

                <path d="M32 5 L53 13 V29
                         C53 44 44 54 32 60
                         C20 54 11 44 11 29 V13 Z"
                      stroke="#E8B99B" stroke-width="3.5"
                      stroke-linejoin="round"/>

                <rect x="23" y="28" width="18" height="15"
                      rx="3" fill="#E8B99B"/>

                <path d="M27 28 V23
                         C27 16 37 16 37 23 V28"
                      stroke="#E8B99B" stroke-width="3"
                      stroke-linecap="round"/>

                <circle cx="32" cy="35" r="2"
                        fill="#49334F"/>
            </svg>
        </div>

        <h2>OfflineChainGuard</h2>

        <p class="subtitle">
            Offline Transaction Synchronization and Security Monitoring
        </p>

        <div class="security-label">
            SECURE ACCESS PORTAL
        </div>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
                autocomplete="username"
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Login Securely</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register here</a>
        </div>

        <div class="footer">
            Protected Access | OfflineChainGuard
        </div>

    </div>

</body>
</html>
